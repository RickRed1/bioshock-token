<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <radialGradient id="adamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#400000"/>
    </radialGradient>
  </defs>
  <!-- Outer Art Deco Octagon / Border -->
  <polygon points="60,10 140,10 190,60 190,140 140,190 60,190 10,140 10,60" fill="#0d1117" stroke="url(#gold)" stroke-width="6"/>
  <!-- Inner Gold Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Core ADAM Vial/Serum Circle -->
  <circle cx="100" cy="100" r="60" fill="url(#adamGlow)" stroke="url(#gold)" stroke-width="4"/>
  <!-- Art Deco Highlight/Shine -->
  <path d="M 70 65 Q 100 45 130 65" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Text Banner -->
  <rect x="40" y="82" width="120" height="36" fill="#0d1117" opacity="0.85" stroke="url(#gold)" stroke-width="2"/>
  <text x="100" y="108" font-size="20" text-anchor="middle" fill="url(#gold)" font-family="serif" font-weight="bold" letter-spacing="3">ADAM</text>
</svg>