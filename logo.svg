<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae16c"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#80620c"/>
    </linearGradient>
    <radialGradient id="adamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="45%" stop-color="#cc0000"/>
      <stop offset="85%" stop-color="#550000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </radialGradient>
  </defs>
  <!-- Deep Ocean Background -->
  <rect width="200" height="200" fill="#040d1a"/>
  <!-- Art Deco Outer Border / Frame -->
  <polygon points="55,10 145,10 190,55 190,145 145,190 55,190 10,145 10,55" fill="#091322" stroke="url(#brass)" stroke-width="5"/>
  <polygon points="60,15 140,15 185,60 185,140 140,185 60,185 15,140 15,60" fill="none" stroke="url(#brass)" stroke-width="1" opacity="0.6"/>
  <!-- Inner Glass Vial / Serum Chamber -->
  <circle cx="100" cy="100" r="58" fill="url(#adamGlow)" stroke="url(#brass)" stroke-width="3"/>
  <!-- Glowing Fluid Bubbles / Highlight -->
  <circle cx="85" cy="80" r="6" fill="#ff9999" opacity="0.4"/>
  <circle cx="115" cy="125" r="4" fill="#ff9999" opacity="0.3"/>
  <path d="M 68 75 Q 100 50 132 75" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Rapture Brass Banner -->
  <rect x="35" y="82" width="130" height="36" fill="#040d1a" stroke="url(#brass)" stroke-width="3"/>
  <text x="100" y="108" font-size="21" text-anchor="middle" fill="url(#brass)" font-family="Times New Roman, serif" font-weight="bold" letter-spacing="4">ADAM</text>
</svg>