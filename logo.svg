<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae16c"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#6e550c"/>
    </linearGradient>
    <radialGradient id="adamRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="60%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#3d0000"/>
    </radialGradient>
    <path id="topTextPath" d="M 55,150 A 95,95 0 1,1 245,150" />
    <path id="bottomTextPath" d="M 45,150 A 105,105 0 0,0 255,150" />
  </defs>
  <!-- Dark Weathered Coin Base -->
  <circle cx="150" cy="150" r="140" fill="#0b1017" stroke="url(#brass)" stroke-width="10"/>
  <circle cx="150" cy="150" r="125" fill="none" stroke="url(#brass)" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  <!-- Art Deco Geometric Side Wings -->
  <g fill="none" stroke="url(#brass)" stroke-width="3">
    <polygon points="50,110 85,130 50,150"/>
    <polygon points="250,110 215,130 250,150"/>
    <path d="M 65,130 L 85,130" stroke-width="4"/>
    <path d="M 235,130 L 215,130" stroke-width="4"/>
  </g>
  <!-- Central Syringe Graphic -->
  <g transform="translate(150,145) rotate(-30)">
    <!-- Barrel -->
    <rect x="-10" y="-50" width="20" height="65" fill="#1b2430" stroke="url(#brass)" stroke-width="3" rx="2"/>
    <!-- Measurement Ticks -->
    <line x1="-6" y1="-35" x2="-2" y2="-35" stroke="url(#brass)" stroke-width="2"/>
    <line x1="-6" y1="-22" x2="-2" y2="-22" stroke="url(#brass)" stroke-width="2"/>
    <line x1="-6" y1="-9" x2="-2" y2="-9" stroke="url(#brass)" stroke-width="2"/>
    <line x1="-6" y1="4" x2="-2" y2="4" stroke="url(#brass)" stroke-width="2"/>
    <!-- Plunger Top -->
    <rect x="-7" y="-68" width="14" height="18" fill="url(#brass)" rx="1"/>
    <line x1="0" y1="-68" x2="0" y2="-82" stroke="url(#brass)" stroke-width="4"/>
    <line x1="-9" y1="-82" x2="9" y2="-82" stroke="url(#brass)" stroke-width="4"/>
    <!-- Needle Tip -->
    <polygon points="-3,15 3,15 0,38" fill="url(#brass)"/>
    <line x1="0" y1="38" x2="0" y2="52" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Glowing Red ADAM Droplet -->
  <circle cx="145" cy="210" r="11" fill="url(#adamRed)" stroke="url(#brass)" stroke-width="1.5" filter="drop-shadow(0 0 8px #ff1a1a)"/>
  <!-- Curved Typography: ADAM & EXQUISITE CORPORATION -->
  <text font-family="serif" font-weight="bold" font-size="28" fill="url(#brass)" letter-spacing="5">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">ADAM</textPath>
  </text>
  <text font-family="sans-serif" font-weight="bold" font-size="12.5" fill="url(#brass)" letter-spacing="3.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">EXQUISITE CORPORATION</textPath>
  </text>
</svg>